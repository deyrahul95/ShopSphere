version: "3.9"

services:
  gateway_service:
    image: rahuldey8320/shopsphare-gateway-service:1.0.0
    container_name: gateway-service
    ports:
      - "5000:8080"
    networks:
      - app_network
    depends_on:
      - seq

  user_service:
    image: rahuldey8320/shopsphare-user-service:1.0.0
    container_name: user-service
    networks:
      - app_network
    depends_on:
      - seq

  product_service:
    image: rahuldey8320/shopsphare-product-service:1.0.0
    container_name: product-service
    networks:
      - app_network
    depends_on:
      - seq

  product_service-two:
    image: rahuldey8320/shopsphare-product-service:1.0.0
    container_name: product-service-two
    networks:
      - app_network
    depends_on:
      - seq

  cart_service:
    image: rahuldey8320/shopsphare-cart-service:1.0.0
    container_name: cart-service
    networks:
      - app_network
    depends_on:
      - seq

  order_service:
    image: rahuldey8320/shopsphare-order-service:1.0.0
    container_name: order-service
    networks:
      - app_network
    depends_on:
      - rabbitmq
      - seq

  inventory_service:
    image: rahuldey8320/shopsphare-inventory-service:1.0.0
    container_name: inventory-service
    networks:
      - app_network
    depends_on:
      - seq

  inventory_service-two:
    image: rahuldey8320/shopsphare-inventory-service:1.0.0
    container_name: inventory-service-two
    networks:
      - app_network
    depends_on:
      - seq

  payment_service:
    image: rahuldey8320/shopsphare-payment-service:1.0.0
    container_name: payment-service
    networks:
      - app_network
    depends_on:
      - seq

  notification_service:
    image: rahuldey8320/shopsphare-notification-service:1.0.0
    container_name: notification-service
    depends_on:
      - rabbitmq
      - seq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app_network

  seq:
    image: datalust/seq:latest
    container_name: seq
    ports:
      - "8081:80"
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq_data:/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  rabbitmq_data:
  seq_data:
