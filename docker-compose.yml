version: '3.9'

services:
  gateway_service:
    build:
      context: ./GatewayService
      dockerfile: Dockerfile
    image: gateway-service:latest
    container_name: gateway-service-1
    ports:
      - "5110:8080"
    networks:
      - app_network
    depends_on:
      - consul
      - seq

  user_service:
    build:
      context: ./UserService
      dockerfile: Dockerfile
    image: user-service:latest
    container_name: user-service-1
    # ports:
    #   - "5120:8080"
    networks:
      - app_network
    depends_on:
      - seq

  product_service:
    build:
      context: ./ProductService
      dockerfile: Dockerfile
    image: product-service:latest
    container_name: product-service-1
    # ports:
    #   - "5130:8080"
    networks:
      - app_network
    depends_on:
      - seq

  cart_service:
    build:
      context: ./CartService
      dockerfile: Dockerfile
    image: cart-service:latest
    container_name: cart-service-1
    # ports:
    #   - "5140:8080"
    networks:
      - app_network
    depends_on:
      - seq

  order_service:
    build:
      context: .
      dockerfile: ./OrderService/Dockerfile
    image: order-service:latest
    container_name: order-service-1
    # ports:
    #   - "5150:8080"
    networks:
      - app_network
    depends_on:
      - rabbitmq
      - seq

  inventory_service:
    build:
      context: ./InventoryService
      dockerfile: Dockerfile
    image: inventory-service:latest
    container_name: inventory-service-1
    # ports:
    #   - "5160:8080"
    networks:
      - app_network
    depends_on:
      - seq

  payment_service:
    build:
      context: .
      dockerfile: ./PaymentService/Dockerfile
    image: payment-service:latest
    container_name: payment-service-1
    # ports:
    #   - "5170:8080"
    networks:
      - app_network
    depends_on:
      - seq

  notification_service:
    build:
      context: .
      dockerfile: ./NotificationService/Dockerfile
    image: notification-service:latest
    container_name: notification-service-1
    depends_on:
      - rabbitmq
      - seq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app_network

  seq:
    image: datalust/seq:latest
    container_name: seq-1
    ports:
      - "5431:5431"
      - "8081:80"
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq_data:/data
    networks:
      - app_network

  consul:
    image: consul:latest  
    ports:
      - "8500:8500"  
    command: "consul agent -dev -client=0.0.0.0"  
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  rabbitmq_data:
  seq_data:
