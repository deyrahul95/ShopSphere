services:
  gateway_service:
    build:
      context: ./GatewayService
      dockerfile: Dockerfile
    image: shopsphare-gateway-service:${TAG:-latest}
    container_name: gateway-service
    ports:
      - "5000:8080"
    networks:
      - app_network
    depends_on:
      - seq

  user_service:
    build:
      context: ./UserService
      dockerfile: Dockerfile
    image: shopsphare-user-service:${TAG:-latest}
    container_name: user-service
    networks:
      - app_network
    depends_on:
      - seq

  product_service:
    build:
      context: ./ProductService
      dockerfile: Dockerfile
    image: shopsphare-product-service:${TAG:-latest}
    container_name: product-service
    networks:
      - app_network
    depends_on:
      - seq

  cart_service:
    build:
      context: ./CartService
      dockerfile: Dockerfile
    image: shopsphare-cart-service:${TAG:-latest}
    container_name: cart-service
    networks:
      - app_network
    depends_on:
      - seq

  order_service:
    build:
      context: .
      dockerfile: ./OrderService/Dockerfile
    image: shopsphare-order-service:${TAG:-latest}
    container_name: order-service
    networks:
      - app_network
    depends_on:
      - rabbitmq
      - seq

  inventory_service:
    build:
      context: ./InventoryService
      dockerfile: Dockerfile
    image: shopsphare-inventory-service:${TAG:-latest}
    container_name: inventory-service
    networks:
      - app_network
    depends_on:
      - seq

  payment_service:
    build:
      context: .
      dockerfile: ./PaymentService/Dockerfile
    image: shopsphare-payment-service:${TAG:-latest}
    container_name: payment-service
    networks:
      - app_network
    depends_on:
      - seq

  notification_service:
    build:
      context: .
      dockerfile: ./NotificationService/Dockerfile
    image: shopsphare-notification-service:${TAG:-latest}
    container_name: notification-service
    depends_on:
      - rabbitmq
      - seq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app_network

  seq:
    image: datalust/seq:2025.2
    container_name: seq
    ports:
      - "8081:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_PASSWORD: "password"
    volumes:
      - seq_data:/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  rabbitmq_data:
  seq_data:
