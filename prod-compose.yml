services:
  gateway_service:
    image: deyrahul95/shopsphare-gateway-service:latest
    container_name: gateway-service
    ports:
      - "5000:8080"
    networks:
      - app_network
    depends_on:
      - seq

  user_service:
    image: deyrahul95/shopsphare-user-service:latest
    container_name: user-service
    networks:
      - app_network
    depends_on:
      - seq

  product_service:
    image: deyrahul95/shopsphare-product-service:latest
    container_name: product-service
    networks:
      - app_network
    depends_on:
      - seq

  cart_service:
    image: deyrahul95/shopsphare-cart-service:latest
    container_name: cart-service
    networks:
      - app_network
    depends_on:
      - seq

  order_service:
    image: deyrahul95/shopsphare-order-service:latest
    container_name: order-service
    networks:
      - app_network
    depends_on:
      - rabbitmq
      - seq

  inventory_service:
    image: deyrahul95/shopsphare-inventory-service:latest
    container_name: inventory-service
    networks:
      - app_network
    depends_on:
      - seq

  payment_service:
    image: deyrahul95/shopsphare-payment-service:latest
    container_name: payment-service
    networks:
      - app_network
    depends_on:
      - seq

  notification_service:
    image: deyrahul95/shopsphare-notification-service:latest
    container_name: notification-service
    depends_on:
      - rabbitmq
      - seq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app_network

  seq:
    image: datalust/seq:2025.2
    container_name: seq
    ports:
      - "8081:80"
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq_data:/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  rabbitmq_data:
  seq_data:
